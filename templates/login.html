<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Co-Intelligence</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    html, body {
      height: 100%;
    }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
    }
    .login-card {
      width: 400px;
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      justify-content: center;
      margin-bottom: 8px;
    }
    .login-logo .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .login-tagline {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .login-field {
      margin-bottom: 12px;
    }
    .login-label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .login-demo-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .login-demo-link {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .login-demo-link:hover {
      color: var(--text-primary);
    }
    .login-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 28px;
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <span class="logo-dot"></span>
      Co-Intelligence
    </div>

    <!-- Tagline -->
    <div class="login-tagline">think alongside AI, not behind it</div>

    <!-- Form -->
    <form method="POST" action="{{ url_for('login') }}">
      <div class="login-field">
        <label class="login-label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your university email" autocomplete="email" />
      </div>
      <div class="login-field" style="margin-bottom:20px;">
        <label class="login-label" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
        Sign in
      </button>
    </form>

    <!-- Demo quick-links -->
    <div class="login-demo-links">
      <a href="{{ url_for('student.prompting') }}" class="login-demo-link">Sign in as student</a>
      <a href="{{ url_for('instructor.dashboard') }}" class="login-demo-link">Sign in as instructor</a>
    </div>

    <!-- Access note -->
    <div class="login-note">Contact your instructor if you need access.</div>

  </div>
</div>
</body>
</html>
